services:
  postgres:
    image: postgres:16-alpine
    container_name: quantdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantdesk}
      POSTGRES_DB: ${POSTGRES_DB:-quantdesk}
      # Deterministic collation so ORDER BY is stable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantdesk} -d ${POSTGRES_DB:-quantdesk}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quantdesk]

  redis:
    image: redis:7-alpine
    container_name: quantdesk-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [quantdesk]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: quantdesk-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantdesk}:${POSTGRES_PASSWORD:-quantdesk}@postgres:5432/${POSTGRES_DB:-quantdesk}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [quantdesk]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # Baked at build time — Next.js inlines NEXT_PUBLIC_* into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: quantdesk-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side calls inside the compose network go direct to the api service.
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api: { condition: service_started }
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [quantdesk]

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  quantdesk:
    driver: bridge
