# Production overlay: adds Caddy as the public HTTPS reverse proxy.
#
# Run with:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Requires `DOMAIN=your-domain.com` in .env (fails loudly if missing). Point
# `@` and `www` A records at this server, and an `api` A record too, before the
# first `up`, so Caddy can obtain certificates.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=your-domain.com in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [quantdesk]

volumes:
  caddy_data:
  caddy_config:
